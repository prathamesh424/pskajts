services:
  - type: web
    name: windsight-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ELEXON_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: FRONTEND_URL
        value: "*"
      - key: CACHE_TTL
        value: "3600"
