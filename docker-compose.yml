services:
  backend:
    build: ./backend
    container_name: windsight-api
    ports:
      - "8000:8000"
    environment:
      - ELEXON_BASE_URL=https://data.elexon.co.uk/bmrs/api/v1
      - FRONTEND_URL=http://localhost:3000
      - CACHE_TTL=3600
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    container_name: windsight-ui
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
